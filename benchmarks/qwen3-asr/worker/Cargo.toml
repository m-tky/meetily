[package]
name = "qwen-speech-worker"
default-run = "qwen-speech-worker"
version = "0.1.0"
edition = "2021"
[workspace]
[features]
model-preparation = []
[[bin]]
name = "qwen-model-init"
path = "src/bin/qwen-model-init.rs"
required-features = ["model-preparation"]
[dependencies]
qwen-asr = { path = "../../../vendor/qwen-asr", default-features = false, features = ["blas"] }
silero_rs = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", package = "silero", default-features = false, features = ["static-model"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
