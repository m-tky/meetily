name: Meetily Local Windows Pre-release

on:
  push:
    tags:
      - 'windows-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      MEETILY_DISABLE_ANALYTICS: '1'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate app version and Windows tag
        id: version
        shell: pwsh
        env:
          REF_KIND: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version=(Get-Content frontend/src-tauri/tauri.conf.json -Raw|ConvertFrom-Json).version
          if($version -cnotmatch '^\d+\.\d+\.\d+$'){throw 'Expected a three-part base app version'}
          if($env:REF_KIND -eq 'tag'){
            if($env:REF_NAME -cnotmatch '^windows-v(?<core>\d+\.\d+\.\d+)(?:-rc\.[1-9]\d*)?$'){throw 'Expected windows-vX.Y.Z or windows-vX.Y.Z-rc.N'}
            if($Matches.core -cne $version){throw 'Tag base version differs from tauri.conf.json'}
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5
      - name: Install pinned Rust MSVC toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Build unsigned CPU NSIS installer and run native tests
        shell: pwsh
        run: |
          ./frontend/scripts/build-windows-installer.ps1 -NativeTargetDirectory "$env:RUNNER_TEMP/meetily-native" -WorkerTargetDirectory "$env:RUNNER_TEMP/meetily-worker" -OutputDirectory "$env:GITHUB_WORKSPACE/dist/windows"
      - name: Install, inspect bundled DLLs, synthetic silence, helper, FFmpeg, uninstall
        shell: pwsh
        run: |
          $exe=@(Get-ChildItem dist/windows -Filter '*.exe' -File)
          if($exe.Count -ne 1){throw 'Expected one installer'}
          ./frontend/scripts/test-windows-installer.ps1 -Installer $exe[0].FullName -ReportPath "$env:GITHUB_WORKSPACE/dist/windows/installer-smoke.json"
      - name: Upload tested installer and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meetily-windows-x64-${{ steps.version.outputs.version }}
          path: |
            dist/windows/*.exe
            dist/windows/*.exe.sha256
            dist/windows/windows-build.json
            dist/windows/installer-smoke.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve failed-build diagnostics (not release assets)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNVERIFIED-windows-failure-diagnostics
          path: |
            dist/windows/*
            frontend/src-tauri/binaries/qwen/*
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    # This local fork must never update the upstream project's releases.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/windows-v') && github.repository != 'Zackriya-Solutions/meeting-minutes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      APP_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: meetily-windows-x64-${{ needs.build.outputs.version }}
          path: artifacts
      - name: Verify artifact identity, hash and install-test result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root=pathlib.Path('artifacts')
          files=list(root.glob('*.exe'))
          assert len(files)==1, 'Expected exactly one installer'
          exe=files[0]
          digest=hashlib.sha256(exe.read_bytes()).hexdigest()
          line=pathlib.Path(str(exe)+'.sha256').read_text().strip()
          assert line==digest+'  '+exe.name, 'Checksum file mismatch'
          meta=json.loads((root/'windows-build.json').read_text(encoding='utf-8-sig'))
          smoke=json.loads((root/'installer-smoke.json').read_text(encoding='utf-8-sig'))
          assert meta['version']==os.environ['APP_VERSION']
          assert re.fullmatch(r'windows-v'+re.escape(meta['version'])+r'(?:-rc\.[1-9]\d*)?',os.environ['RELEASE_TAG'])
          assert meta['identifier']=='local.meetily.desktop'
          assert meta['target']=='x86_64-pc-windows-msvc'
          assert meta['profile']=='release'
          assert meta['signed'] is False and meta['updater'] is False and meta['modelBundled'] is False
          assert meta['installer']==dict(name=exe.name,sha256=digest,bytes=exe.stat().st_size)
          assert smoke['stage']=='complete' and smoke['keptInstalled'] is False
          assert smoke['workerExitCode']==0 and smoke['silence']['status']=='no_speech'
          assert smoke['dllPathsVerified'] and smoke['developerPathRemoved']
          assert smoke['helperPingShutdown'] and smoke['helperCrtPathsVerified'] and smoke['ffmpegVersionVerified']
          assert smoke['realAudioUsed'] is False
          PY
      - name: Publish Windows-tag Pre-release (never latest or stable)
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" --repo "$GH_REPO" --json isPrerelease,isDraft > existing-release.json; then
            python3 - <<'PY'
          import json
          info=json.load(open('existing-release.json'))
          assert info['isPrerelease'] and not info['isDraft'], 'Refusing to overwrite a stable/draft release'
          PY
          else
            cat > release-notes.md <<'NOTES'
          Experimental, unsigned Windows x64/MSVC CPU build of Meetily Local.

          - NSIS per-user installer; no upstream updater. Models are not bundled and nothing is downloaded before explicit consent.
          - NEW: Welcome and Settings / Transcription / Qwen offer consent-based model download, SHA256 verification, local INT8 initialization, cancellation/retry, and selection after validation. Qwen-only first-run setup does not download Parakeet or a summary model; the original setup path remains available.
          - Select Japanese, English or Thai, check the consent box, then choose **Agree and set up Qwen**. Allow ~4.7 GB download, ~6.5 GiB free disk space, several GB available RAM, and several minutes of CPU initialization. Qwen3-ASR 1.7B decoder-INT8 (encoder/prefill F32) requires AVX2/FMA.
          - Manual/offline preparation is still available in installed `qwen/SETUP.md` and `qwen/prepare-qwen-model.ps1`.
          - CI checks installation/runtime plus synthetic setup/download/controller tests. It does not download model weights or exercise the complete GUI + real HTTPS setup flow. This is not clean-host/full-meeting/recording-quality acceptance; no real meeting or ChatGPT login is exercised by CI.
          - Unsigned executables may trigger SmartScreen. Check the attached SHA256 before installing.
          - Third-party notices and the FFmpeg GPLv3 build/source reference are included.
          NOTES
            gh release create "$tag" --repo "$GH_REPO" --verify-tag --prerelease --latest=false --title "Meetily Local Windows $tag" --notes-file release-notes.md
          fi
          assets=(artifacts/*.exe artifacts/*.exe.sha256 artifacts/windows-build.json artifacts/installer-smoke.json)
          gh release upload "$tag" "${assets[@]}" --repo "$GH_REPO" --clobber
